name: Deploy to Azure App Service

# ⚠️ **STILLGELEGT am 2026-07-30 – kein automatischer Trigger mehr.**
#
# Zielbild, die beiden teuer bezahlten Fallstricke, der Grund der Stilllegung und der Weg zurück stehen
# in **docs/deployment-azure.md** – eine Stelle, nicht zwei. Kurzfassung:
#
# Azure ist nicht konfiguriert (`gh secret list` ist leer, es fehlt also nicht nur
# `AZURE_WEBAPP_PUBLISH_PROFILE`). Das Deploy hing per `workflow_run` an jedem grünen CI und wurde
# darum nach jedem erfolgreichen Lauf rot. Ein Tor, das *immer* rot ist, erzieht zum Wegsehen und
# entwertet das echte Rot daneben. Trigger raus, Datei bleibt – wegen der Fallstricke, die in den
# Kommentaren unten an genau der Zeile stehen, die sie betreffen.
#
# Wieder scharf: Secret setzen, `AZURE_WEBAPP_NAME` prüfen, den `workflow_run`-Block unten
# einkommentieren. Checkliste in docs/deployment-azure.md.
#
# ---
#
# Deployt den Single-Host (React-PWA + .NET-API in einem App Service).
# Ablauf: Frontend bauen → nach wwwroot kopieren → dotnet publish → nach Azure.
#
# **Kein Deploy ohne grünes CI.** Getriggert wurde nicht direkt vom Push, sondern vom Abschluss des
# CI-Workflows auf `main` (`workflow_run`) – und nur, wenn dessen `conclusion == success` ist. `needs:`
# geht hier nicht, weil das Tor in einem eigenen Workflow steckt. Siehe docs/codequalitaet-gates-plan.md (A2).

on:
  # Stillgelegt (s. o.) – dieser Block ist der eine Schalter, der das Deploy wieder ans CI hängt:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]
  #
  # Handbetrieb bleibt: deployt den Stand des gewählten Branch – scheitert ohne Secret bewusst laut,
  # statt Erfolg vorzutäuschen.
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: pugling            # ggf. an den echten App-Service-Namen anpassen
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20"
  API_PROJECT: backend/Pugling.Api

jobs:
  build-and-deploy:
    # Roter (oder abgebrochener) CI-Lauf → dieser Job läuft gar nicht an. Bleibt trotz stillgelegtem
    # `workflow_run` stehen: solange nur der Handbetrieb triggert, ist der linke Zweig immer wahr; kommt
    # der Trigger zurück, greift der rechte sofort wieder. Nichts umzustellen.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # **Fallstrick 2** (docs/deployment-azure.md): bei `workflow_run` checkt Actions per Default den
      # Default-Branch-HEAD aus, **nicht** den Commit, der geprüft wurde. Ohne dieses `ref` könnte ein
      # ungeprüfter Folge-Commit mitdeployen – und zwar mit grünem Häkchen daneben.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # 1) Frontend bauen und in das wwwroot der API legen (same-origin: /api + SPA aus einer Domain)
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Frontend nach wwwroot kopieren
        run: cp -r frontend/dist/. ${{ env.API_PROJECT }}/wwwroot/

      # 2) API veröffentlichen (inkl. wwwroot)
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: API publish
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o publish

      # 3) Nach Azure deployen
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
