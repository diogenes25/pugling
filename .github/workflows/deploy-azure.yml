name: Deploy to Azure App Service

# ⚠️ **STILLGELEGT am 2026-07-30 – kein automatischer Trigger mehr.**
#
# Azure ist nicht konfiguriert: es ist **überhaupt kein Repo-Secret gesetzt** (`gh secret list` leer),
# also fehlt `AZURE_WEBAPP_PUBLISH_PROFILE`. Solange das so ist, scheitert `azure/webapps-deploy` mit
# "No credentials found" – und weil das Deploy per `workflow_run` an jedem grünen CI hing, kam nach
# jedem erfolgreichen Lauf ein roter Deploy-Lauf hinterher. Ein Tor, das *immer* rot ist, erzieht zum
# Wegsehen und entwertet das echte Rot daneben (docs/codequalitaet-gates-plan.md, „mechanische Tore
# statt Disziplin"). Darum: Trigger raus, Datei bleibt.
#
# **Warum nicht gelöscht?** Wegen der beiden Fallstricke weiter unten. Beide haben schon einmal Geld
# gekostet, und den zweiten merkt man nicht:
#   1. `npm ci --legacy-peer-deps` – ohne das Flag brach der Deploy **24 Tage unbemerkt** (`2c4eb69`).
#   2. Der Checkout muss `workflow_run.head_sha` nehmen, sonst deployt der Default-Branch-HEAD und
#      damit womöglich ein **ungeprüfter** Folge-Commit.
# Wer das Deployment neu baut, fängt bei diesen zwei Punkten an, nicht bei null.
#
# **Wieder scharf stellen** (wenn der App Service existiert): Secret setzen (Portal → App Service →
# „Veröffentlichungsprofil abrufen"), `AZURE_WEBAPP_NAME` prüfen, und den `workflow_run`-Block unten
# wieder einkommentieren. Die `if:`-Bedingung am Job ist bewusst stehen geblieben und trägt beide Fälle
# schon – am Job selbst ist dann nichts zu ändern.
#
# ---
#
# Deployt den Single-Host (React-PWA + .NET-API in einem App Service).
# Ablauf: Frontend bauen → nach wwwroot kopieren → dotnet publish → nach Azure.
#
# **Kein Deploy ohne grünes CI.** Getriggert wurde nicht direkt vom Push, sondern vom Abschluss des
# CI-Workflows auf `main` (`workflow_run`) – und nur, wenn dessen `conclusion == success` ist. `needs:`
# geht hier nicht, weil das Tor in einem eigenen Workflow steckt. Siehe docs/codequalitaet-gates-plan.md (A2).

on:
  # Stillgelegt (s. o.) – dieser Block ist der eine Schalter, der das Deploy wieder ans CI hängt:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]
  #
  # Handbetrieb bleibt: deployt den Stand des gewählten Branch – scheitert ohne Secret bewusst laut,
  # statt Erfolg vorzutäuschen.
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: pugling            # ggf. an den echten App-Service-Namen anpassen
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20"
  API_PROJECT: backend/Pugling.Api

jobs:
  build-and-deploy:
    # Roter (oder abgebrochener) CI-Lauf → dieser Job läuft gar nicht an. Bleibt trotz stillgelegtem
    # `workflow_run` stehen: solange nur der Handbetrieb triggert, ist der linke Zweig immer wahr; kommt
    # der Trigger zurück, greift der rechte sofort wieder. Nichts umzustellen.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Bei `workflow_run` checkt Actions per Default den Default-Branch-HEAD aus, **nicht** den Commit,
      # der geprüft wurde. Ohne dieses `ref` könnte ein ungeprüfter Folge-Commit mitdeployen.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # 1) Frontend bauen und in das wwwroot der API legen (same-origin: /api + SPA aus einer Domain)
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # `--legacy-peer-deps`: `vite-plugin-pwa@0.21` deklariert Peer `vite ^3…^6`, installiert ist
      # `vite@8` (siehe frontend/CLAUDE.md). Ohne das Flag brach `npm ci` hier mit ERESOLVE ab – seit
      # dem Vite-8-Sprung (2c4eb69, 2026-07-05) also **jeder** Deploy, unbemerkt, weil niemand das
      # Ergebnis las. Aufgefallen beim Einziehen des Frontend-Tors in ci.yml (Etappe D1), das denselben
      # Befehl ausführt und darum absichtlich dieselbe Umgebung benutzt.
      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Frontend nach wwwroot kopieren
        run: cp -r frontend/dist/. ${{ env.API_PROJECT }}/wwwroot/

      # 2) API veröffentlichen (inkl. wwwroot)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: API publish
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o publish

      # 3) Nach Azure deployen
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
