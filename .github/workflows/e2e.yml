name: E2E

# Playwright bewusst **nicht** im Haupttor (ci.yml): ein Browser-Runner plus zwei hochzufahrende Server
# kostet Minuten, und das Haupttor soll billig bleiben, damit es niemand umgeht.
# Siehe docs/codequalitaet-gates-plan.md (Etappe D2).
#
# **Kein `push: main`-Trigger, und das ist eine Entscheidung, kein Vergessen.** Die E2E fahren einen
# echten Browser gegen zwei Server – flankierende Diagnose, nicht das Freigabe-Tor für einen Release.
# Sie blocken darum kein Deploy, sondern melden sich am PR und nachts.
#
# Der Hebel dazu lag am Deploy, nicht hier: es hing per `workflow_run` am Workflow `CI`, nicht an diesem.
# Seit 2026-07-30 ist es **stillgelegt** (deploy-azure.yml: Azure nicht konfiguriert), es gibt also
# derzeit überhaupt kein Freigabe-Tor, das man verfehlen könnte. Wer die E2E später zum Tor machen will,
# muss das neu gebaute Deployment zusätzlich auf diesen Workflow warten lassen – und dann auch die
# geteilte Wegwerf-DB unten überdenken, denn ein Tor darf nicht an einer Reihenfolge hängen.
#
# Die Specs teilen sich laut frontend/CLAUDE.md **eine** Wegwerf-DB je Lauf (playwright.config.ts legt sie
# in den Temp-Ordner). Darum `workers: 1` und `retries: 0` dort – und darum wird hier **nichts**
# nachgeholt: ein Retry liefe auf der bereits beschriebenen DB und könnte grün werden, ohne dass der
# Fehler weg ist. Ein Rot soll hier ein Rot bleiben.

on:
  pull_request:
  schedule:
    # 03:00 UTC. Geplante Läufe gibt es nur auf dem Default-Branch – der nächtliche Lauf prüft also `main`.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Nur Lesen – der Testjob führt `npm ci` und damit fremden Paketcode aus. Das Schreibrecht auf Issues
# trägt allein der Job `zustellung` unten, der nichts installiert und nichts baut.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  # Dieselbe Node-Version wie in ci.yml und deploy-azure.yml.
  NODE_VERSION: "20"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TZ: UTC

jobs:
  e2e:
    name: Playwright (Vater→Sohn-Durchstich)
    runs-on: ubuntu-latest
    # Reißleine gegen einen hängenden Server: ohne sie wartet ein blockierter `webServer`-Start bis zum
    # Runner-Limit. Die Suite braucht 25 Tests bei `workers: 1`; 30 Minuten sind reichlich, aber endlich.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: NuGet-Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.*.props', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # `--legacy-peer-deps`: vite-plugin-pwa@0.21 deklariert Peer `vite ^3…^6`, installiert ist `vite@8`.
      # Ohne das Flag bricht `npm ci` mit ERESOLVE ab (siehe frontend/CLAUDE.md und Etappe D1).
      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # Nur Chromium: playwright.config.ts fährt genau ein Projekt (`devices["Desktop Chrome"]`, ohne
      # `channel`, also das gebündelte Chromium). Firefox und WebKit mitzuladen kostete Minuten für
      # Browser, die kein Test anfasst. `--with-deps` zieht die Systembibliotheken nach, die dem
      # ubuntu-Runner fehlen.
      - name: Playwright-Browser installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # **Das Backend wird vorgebaut, nicht nur gestartet.** playwright.config.ts startet es per
      # `dotnet run` und gibt dem Port 120 s. Kalt müsste `dotnet run` in diesem Fenster erst
      # restaurieren und bauen – auf einem frischen Runner reicht das nicht zuverlässig, und der Lauf
      # scheiterte dann am Timeout statt an einem Testfehler. Vorgebaut startet der Server in Sekunden.
      # Debug ist Absicht: `dotnet run` ohne `-c` nimmt Debug, also genau diese Artefakte.
      - name: Backend vorbauen
        run: dotnet build backend/Pugling.Api

      # Die Server (API mit Wegwerf-DB + Vite) startet Playwright selbst – `webServer` in
      # playwright.config.ts. `CI` ist auf dem Runner gesetzt, damit greift dort
      # `reuseExistingServer: false` auch für Vite: kein stehengelassener Server verfälscht den Lauf.
      - name: E2E
        working-directory: frontend
        run: npx playwright test

      # Bei Rot sind Trace und Screenshot der ganze Wert des Laufs: `trace: "retain-on-failure"` und
      # `screenshot: "only-on-failure"` legen sie unter frontend/test-results ab. Ohne diesen Schritt
      # wäre ein roter nächtlicher Lauf eine Meldung ohne Befund.
      - name: Trace und Screenshots hochladen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artefakte
          path: frontend/test-results/**
          if-no-files-found: warn
          retention-days: 14

  # ── Zustellung ───────────────────────────────────────────────────────────────────────────────────
  # Ein Tor ohne Zustellung ist kein Tor. Der Lauf vom 2026-07-31 fand einen echten Bruch (eine im
  # Frontend gelöschte Ebene, die der Spec noch bediente) – und erreichte zwei Tage lang niemanden. GitHub
  # benachrichtigt bei fehlgeschlagenen *scheduled* Läufen bestenfalls per persönlicher Mail-Einstellung;
  # darauf kann sich niemand verlassen.
  #
  # Zugestellt wird als **Issue mit Zustand**: bei Rot angelegt bzw. – wenn schon eines offen ist –
  # kommentiert, bei Grün geschlossen. Ein neues Issue je Nacht wäre nach einer Woche Rauschen; der
  # Zustand offen/geschlossen ist die eigentliche Auskunft.
  #
  # **Warum ein eigener Job und nicht zwei Schritte am Ende von `e2e`** – drei Gründe, jeder für sich
  # ausreichend:
  #  1. `timeout-minutes: 30` **bricht ab**, es schlägt nicht fehl. Bei Abbruch läuft weder `failure()`
  #     noch `success()` – der Fall, für den die Reißleine da ist, stellte sonst als Einziger nichts zu.
  #     `always()` plus `needs.e2e.result` deckt ihn mit ab.
  #  2. Fällt die Zustellung selbst (gh-5xx, Rate-Limit), färbte sie den **grünen** Testlauf rot. Als
  #     eigener Job bleibt „Test rot" von „Meldung kaputt" unterscheidbar.
  #  3. `issues: write` bleibt aus dem Job heraus, der `npm ci` und damit fremden Paketcode ausführt.
  #
  # **Nur ohne Pull Request** (B-26, Entscheidung 3): am PR ist der rote Check selbst die Zustellung, und
  # ein Fork-PR bekommt ohnehin keinen Token mit Schreibrecht.
  #
  # Bekannte Grenze, gegen die hier nichts hilft: GitHub schaltet geplante Läufe in öffentlichen Repos
  # nach 60 Tagen ohne Repo-Aktivität selbsttätig ab (es mailt vorher an die Verwaltung). Ein Nightly,
  # das nicht läuft, meldet auch nichts.
  zustellung:
    name: Rot zustellen, Grün zurücknehmen
    needs: e2e
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # `!= 'success'` statt `== 'failure'`: ein abgebrochener oder übersprungener Testjob ist ebenfalls
      # keine Auskunft „alles grün" und gehört zugestellt.
      - name: Rotes Nightly zustellen
        if: ${{ needs.e2e.result != 'success' }}
        run: |
          set -euo pipefail
          # `gh issue create --label` bricht ab, wenn es das Label nicht gibt – idempotent anlegen.
          gh label create e2e-nightly --color B60205 --description "Roter E2E-Nachtlauf" 2>/dev/null || true
          body=$(printf '%s\n' \
            "Der E2E-Lauf auf \`$GITHUB_REF_NAME\` ist nicht grün – Ergebnis \`${{ needs.e2e.result }}\`, Commit \`$GITHUB_SHA\`." \
            "" \
            "$RUN_URL" \
            "" \
            "Trace und Screenshots liegen als Artefakt \`playwright-artefakte\` am Lauf (14 Tage).")
          open=$(gh issue list --label e2e-nightly --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "E2E-Nachtlauf ist rot" --label e2e-nightly --body "$body"
          fi

      # Das Gegenstück – sonst bliebe das Issue offen stehen und wäre nach der ersten Reparatur eine Lüge.
      - name: Zustellung zurücknehmen, wenn wieder grün
        if: ${{ needs.e2e.result == 'success' }}
        run: |
          set -euo pipefail
          # Kein `gh label create` nötig: `gh issue list` mit unbekanntem Label liefert leer und Status 0.
          for n in $(gh issue list --label e2e-nightly --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Wieder grün: $RUN_URL"
          done
