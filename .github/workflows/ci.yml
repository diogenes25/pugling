name: CI

# Das Tor vor `main`: macht die vorhandene Integrationstest-Suite wirksam.
# Vorher gab es zwischen "Code entsteht" und "Code ist deployt" keinen Schritt, der die Tests aufmacht –
# `deploy-azure.yml` baute und deployte ohne `dotnet test`. Siehe docs/codequalitaet-gates-plan.md (Etappe A).
#
# Reihenfolge ist Absicht: **erst Tests, dann Format.** Der inhaltliche Befund ("welche Regel ist gebrochen")
# soll zuerst im Log stehen; die Formatprüfung ist mit ~140 s der teuerste Schritt und sagt fachlich nichts.
# Das Deployment hängt über `workflow_run` an diesem Workflow (siehe deploy-azure.yml).
#
# Drei Jobs, **bewusst ohne `needs:` zwischen ihnen** (Etappe D1/D3): Backend, Frontend und Markdown
# prüfen Unabhängiges und laufen parallel. Das Deploy hängt am Gesamtergebnis des Workflows, zieht
# alle drei also automatisch mit – ohne dass hier eine Reihenfolge erfunden werden muss.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# Auf einem PR darf ein neuer Push den alten Lauf abbrechen. Auf `main` **nicht**: dort hängt das Deploy
# am Ergebnis, und ein abgebrochener Lauf sähe wie "nie geprüft" aus.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # **Dieselbe Version wie in deploy-azure.yml** – ein Tor, das eine andere Umgebung prüft als die,
  # in der gebaut und deployt wird, bewacht nichts. `setup-node` zieht bei "20" das neueste 20.x und
  # erfüllt damit `vite@8` (engines `^20.19.0 || >=22.12.0`); wer hier auf ein älteres 20.x pinnt,
  # bricht den Build.
  NODE_VERSION: "20"
  # Die Testsuite fährt je Testklasse eine frische SQLite hoch; ohne UTC-Runner-Annahme arbeiten die
  # Tests ohnehin (Wanduhr ist in der WebAppFactory neutralisiert), aber explizit ist besser als implizit.
  TZ: UTC

jobs:
  ci:
    name: Build, Test, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # NuGet-Cache (A3): ohne ihn kostet `restore` den Großteil der Job-Laufzeit. Schlüssel über alle
      # csproj – eine neue PackageReference invalidiert den Cache, ein Codeedit nicht.
      - name: NuGet-Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.*.props', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Pugling.sln

      - name: Build
        run: dotnet build Pugling.sln -c Release --no-restore

      # `--no-build`: die Solution ist im Schritt davor schon in Release gebaut. Warm liegt die ganze
      # Suite bei ~63 s – es gibt damit kein Laufzeit-Argument gegen dieses Tor.
      #
      # `--collect` (C5): die Zweigabdeckung ist der aussagekräftige Wert (die 97,9 % Zeilen sind ein
      # Artefakt der async-State-Machines). Sie wird **berichtet, nicht erzwungen** – eine Quote als
      # Selbstzweck ist die typische Coverage-Falle. Erzwungen wird stattdessen die
      # **Endpunkt**-Vollständigkeit, und zwar im Testlauf selbst (EndpointCoverageGuard).
      - name: Test
        run: >
          dotnet test Pugling.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # D4: `DocsCaptureTests` überschreibt `docs/api-examples/` bei *jedem* Lauf (Wanduhr in der
      # WebAppFactory neutralisiert, `TZ: UTC` oben) – die Behauptung "byte-stabil" war bis hierhin
      # nur eine Annahme, die niemand einfing. Ein Diff hier heißt: der Runner erzeugt einen anderen
      # Stand als zuletzt committet wurde (Zeitzone, Locale, Zeilenenden, Testreihenfolge).
      - name: Docs-Byte-Stabilität prüfen (D4)
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --exit-code -- docs/api-examples; then
            echo "::error::docs/api-examples weicht nach DocsCaptureTests vom committeten Stand ab – neu erzeugen und committen (siehe docs/codequalitaet-gates-plan.md, D4)."
            exit 1
          fi

      # **Der Abdeckungs-Wächter urteilt im Aufräumen eines Assembly-Fixtures.** Der Konsolen-Zusammenzug
      # von `dotnet test` meldet dann trotzdem "Passed!" und zeigt bloß `Xunit.Sdk.TestPipelineException`
      # (der Exit-Code ist korrekt 1, und die .trx trägt die Meldung). Ohne diesen Schritt wäre ein rotes
      # CI ohne Befund; die Datei nennt die nicht abgedeckten Actions.
      - name: Endpunkt-Abdeckung ausgeben
        if: ${{ failure() }}
        run: cat TestResults/endpoint-coverage.txt || echo "(kein Abdeckungs-Bericht – der Lauf scheiterte vorher)"

      - name: Zweigabdeckung ausgeben
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Die Zahl aus der Cobertura-Ausgabe ins Job-Summary, ohne Schwelle. Erst wenn sie über mehrere
          # Läufe stabil ist, lohnt eine Untergrenze (siehe docs/codequalitaet-gates-plan.md, C5).
          report=$(find TestResults -name 'coverage.cobertura.xml' | head -1)
          [ -z "$report" ] && { echo "Kein Cobertura-Bericht gefunden."; exit 0; }
          # `grep -m1` statt `| head -1`: Letzteres schließt die Pipe nach der ersten Zeile und lässt den
          # schreibenden grep mit SIGPIPE/"Broken pipe" scheitern – unter `pipefail` bricht das den Schritt,
          # obwohl der Wert korrekt ermittelt wurde (gemessen: alle fünf CI-Läufe seit D0 rot genau hieran).
          rate=$(grep -m1 -o 'branch-rate="[0-9.]*"' "$report" | grep -o '[0-9.]*')
          lines=$(grep -m1 -o 'line-rate="[0-9.]*"' "$report" | grep -o '[0-9.]*')
          echo "### Abdeckung" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zweige: ${rate} (die aussagekräftige Zahl)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zeilen: ${lines} (irreführend hoch – async-State-Machines)" >> "$GITHUB_STEP_SUMMARY"

      - name: Testergebnisse hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/endpoint-coverage.txt
          if-no-files-found: warn
          retention-days: 14

      # Bewusst hinter den Tests: langsamster Schritt, geringste fachliche Aussage. `--no-restore`, weil
      # oben schon restauriert wurde. Stand bei Einziehen des Tors: sauber.
      - name: Format prüfen
        run: dotnet format Pugling.sln --verify-no-changes --no-restore

  # Etappe D1. Billig (~1 min) und fängt genau die Fehlerklasse, die das Backend-Tor nicht sieht:
  # das Frontend hängt an `api/v1`, und ein Vertragsbruch schlägt dort als **Typfehler** auf. Playwright
  # bleibt bewusst draußen (eigener Workflow, D2) – Browser-Runner und Startzeit gehören nicht ins Haupttor.
  frontend:
    name: Frontend – Typecheck, Build, Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Das Lockfile liegt nicht im Repo-Root, sondern unter frontend/ – ohne diesen Pfad findet
          # der Cache-Schlüssel nichts und der Cache bleibt wirkungslos.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # **`--legacy-peer-deps` ist keine Bequemlichkeit, sondern der dokumentierte Stand des Projekts**
      # (frontend/CLAUDE.md): `vite-plugin-pwa@0.21` deklariert Peer `vite ^3…^6`, installiert ist
      # `vite@8`. Ohne das Flag bricht `npm ci` mit ERESOLVE ab, bevor eine Zeile geprüft wird –
      # gemessen, und zwar seit dem Vite-8-Sprung (2c4eb69, 2026-07-05) auch im Deploy-Workflow, der
      # daran 24 Tage lang unbemerkt scheiterte. Genau dieser blinde Fleck ist der Grund für dieses Tor.
      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # `npm run build` = `tsc -b && vite build`. Der Typecheck ist der eigentliche Gewinn, der
      # Bundle-Build der Nachweis, dass auch das Deploy-Artefakt entstehen kann.
      - name: Typecheck + Build
        working-directory: frontend
        run: npm run build

      - name: Vitest
        working-directory: frontend
        run: npm test

  # Etappe D3. Die Doku ist in diesem Projekt Produkt, nicht Beiwerk (docs/api-examples ist sogar
  # verifizierter Vertrag). Eigener, unabhängiger Job – kein .NET/Node-Setup außer `npx` nötig.
  markdownlint:
    name: Markdown-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx markdownlint-cli2
