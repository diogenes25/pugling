name: CI

# Das Tor vor `main`: macht die vorhandene Integrationstest-Suite wirksam.
# Vorher gab es zwischen "Code entsteht" und "Code ist deployt" keinen Schritt, der die Tests aufmacht –
# `deploy-azure.yml` baute und deployte ohne `dotnet test`. Siehe docs/codequalitaet-gates-plan.md (Etappe A).
#
# Reihenfolge ist Absicht: **erst Tests, dann Format.** Der inhaltliche Befund ("welche Regel ist gebrochen")
# soll zuerst im Log stehen; die Formatprüfung ist mit ~140 s der teuerste Schritt und sagt fachlich nichts.
# Das Deployment hängt über `workflow_run` an diesem Workflow (siehe deploy-azure.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# Auf einem PR darf ein neuer Push den alten Lauf abbrechen. Auf `main` **nicht**: dort hängt das Deploy
# am Ergebnis, und ein abgebrochener Lauf sähe wie "nie geprüft" aus.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Die Testsuite fährt je Testklasse eine frische SQLite hoch; ohne UTC-Runner-Annahme arbeiten die
  # Tests ohnehin (Wanduhr ist in der WebAppFactory neutralisiert), aber explizit ist besser als implizit.
  TZ: UTC

jobs:
  ci:
    name: Build, Test, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # NuGet-Cache (A3): ohne ihn kostet `restore` den Großteil der Job-Laufzeit. Schlüssel über alle
      # csproj – eine neue PackageReference invalidiert den Cache, ein Codeedit nicht.
      - name: NuGet-Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.*.props', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Pugling.sln

      - name: Build
        run: dotnet build Pugling.sln -c Release --no-restore

      # `--no-build`: die Solution ist im Schritt davor schon in Release gebaut. Warm liegt die ganze
      # Suite bei ~63 s – es gibt damit kein Laufzeit-Argument gegen dieses Tor.
      #
      # `--collect` (C5): die Zweigabdeckung ist der aussagekräftige Wert (die 97,9 % Zeilen sind ein
      # Artefakt der async-State-Machines). Sie wird **berichtet, nicht erzwungen** – eine Quote als
      # Selbstzweck ist die typische Coverage-Falle. Erzwungen wird stattdessen die
      # **Endpunkt**-Vollständigkeit, und zwar im Testlauf selbst (EndpointCoverageGuard).
      - name: Test
        run: >
          dotnet test Pugling.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # **Der Abdeckungs-Wächter urteilt im Aufräumen eines Assembly-Fixtures.** Der Konsolen-Zusammenzug
      # von `dotnet test` meldet dann trotzdem "Passed!" und zeigt bloß `Xunit.Sdk.TestPipelineException`
      # (der Exit-Code ist korrekt 1, und die .trx trägt die Meldung). Ohne diesen Schritt wäre ein rotes
      # CI ohne Befund; die Datei nennt die nicht abgedeckten Actions.
      - name: Endpunkt-Abdeckung ausgeben
        if: ${{ failure() }}
        run: cat TestResults/endpoint-coverage.txt || echo "(kein Abdeckungs-Bericht – der Lauf scheiterte vorher)"

      - name: Zweigabdeckung ausgeben
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Die Zahl aus der Cobertura-Ausgabe ins Job-Summary, ohne Schwelle. Erst wenn sie über mehrere
          # Läufe stabil ist, lohnt eine Untergrenze (siehe docs/codequalitaet-gates-plan.md, C5).
          report=$(find TestResults -name 'coverage.cobertura.xml' | head -1)
          [ -z "$report" ] && { echo "Kein Cobertura-Bericht gefunden."; exit 0; }
          rate=$(grep -o 'branch-rate="[0-9.]*"' "$report" | head -1 | grep -o '[0-9.]*')
          lines=$(grep -o 'line-rate="[0-9.]*"' "$report" | head -1 | grep -o '[0-9.]*')
          echo "### Abdeckung" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zweige: ${rate} (die aussagekräftige Zahl)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zeilen: ${lines} (irreführend hoch – async-State-Machines)" >> "$GITHUB_STEP_SUMMARY"

      - name: Testergebnisse hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/endpoint-coverage.txt
          if-no-files-found: warn
          retention-days: 14

      # Bewusst hinter den Tests: langsamster Schritt, geringste fachliche Aussage. `--no-restore`, weil
      # oben schon restauriert wurde. Stand bei Einziehen des Tors: sauber.
      - name: Format prüfen
        run: dotnet format Pugling.sln --verify-no-changes --no-restore
